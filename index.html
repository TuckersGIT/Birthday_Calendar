<script>
  const supabaseUrl = 'https://lkabpfvfgulyfeeupiph.supabase.co';
  const supabaseKey = 'sb_publishable_hLijWKPq4bbHz2Y8h9-m9w_u39gA9tL';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const form = document.getElementById('birthdayForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const file = document.getElementById('photo').files[0];
    const fileName = `${Date.now()}-${file.name}`;

    const { error: uploadError } = await supabaseClient.storage
      .from('photos')
      .upload(fileName, file);

    if (uploadError) {
      alert('Error uploading photo: ' + uploadError.message);
      return;
    }

    const { data: urlData } = supabaseClient.storage.from('photos').getPublicUrl(fileName);
    const photoUrl = urlData.publicUrl;

    const { error: dbError } = await supabaseClient.from('birthdays').insert([
      {
        name: document.getElementById('name').value,
        birthday_date: document.getElementById('date').value,
        photo_url: photoUrl
      }
    ]);

    if (dbError) {
      alert('Error saving to database: ' + dbError.message);
    } else {
      alert('Birthday added successfully!');
      location.reload();
    }
  });

  document.addEventListener('DOMContentLoaded', async () => {
    const calendarEl = document.getElementById('calendar');

    const { data: birthdays, error } = await supabaseClient.from('birthdays').select('*');

    if (error) {
      console.error('Error fetching birthdays:', error);
      return;
    }

    const events = birthdays.map(b => ({
      title: b.name,
      start: b.birthday_date,
      extendedProps: { photo: b.photo_url }
    }));

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      events: events,
      eventContent: function(arg) {
        const customEl = document.createElement('div');
        customEl.style.display = 'flex';
        customEl.style.alignItems = 'center';
        customEl.style.gap = '4px';
        customEl.innerHTML = `<img src="${arg.event.extendedProps.photo}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;"><b>${arg.event.title}</b>`;
        return { domNodes: [customEl] };
      }
    });

    calendar.render();
  });
</script>
